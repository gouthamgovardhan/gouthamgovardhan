<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title description">
  <title id="title">Builder console</title>
  <desc id="description">Animated terminal showing AI, API, data, and observability systems ready for production.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d12" />
      <stop offset="0.55" stop-color="#17152a" />
      <stop offset="1" stop-color="#0b2025" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="0.55" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="996" height="226" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="996" height="44" rx="22" fill="#14111a" />
  <rect x="2" y="26" width="996" height="20" fill="#14111a" />
  <circle cx="28" cy="24" r="6" fill="#fb7185" />
  <circle cx="50" cy="24" r="6" fill="#facc15" />
  <circle cx="72" cy="24" r="6" fill="#4ade80" />
  <text x="500" y="30" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">goutham@builder: ~/production</text>
  <rect x="28" y="62" width="944" height="2" rx="1" fill="url(#line)" opacity="0.8" />

  <text x="34" y="94" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">$ ship --mode=production --excuses=disabled</text>
  <rect x="430" y="76" width="10" height="22" rx="2" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="34" y="132" fill="#4ade80">✓ AI wired</text>
    <text x="205" y="132" fill="#4ade80">✓ APIs awake</text>
    <text x="395" y="132" fill="#4ade80">✓ data durable</text>
    <text x="600" y="132" fill="#facc15">● logs judgmental</text>
    <text x="815" y="132" fill="#22d3ee">● coffee cached</text>
  </g>

  <text x="34" y="174" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" filter="url(#glow)">“Works on my machine” is a clue, not a deployment strategy.</text>
  <text x="34" y="204" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">status: observable · recoverable · interview-defensible</text>

  <circle cx="965" cy="198" r="6" fill="#22d3ee">
    <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
